name: Deploy to TMDHosting

on:
  push:
    branches: [main]
    paths:
      - "zenithlr/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zenithlr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zenithlr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack production artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run deploy:pack

      # appleboy/scp-action (golang SSH) often dies on this host with
      # "unexpected packet in response to channel open". OpenSSH + retries
      # matches how cPanel SSH actually behaves.
      - name: Upload package to server
        working-directory: ${{ github.workspace }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"

          i=1
          while [ "$i" -le 6 ]; do
            echo "Upload attempt $i"
            if scp -P "$PORT" -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              zenithlr/zenith-deploy.tar.gz \
              "${SSH_USERNAME}@${SSH_HOST}:/tmp/zenith-deploy.tar.gz"; then
              echo "Upload succeeded on attempt $i"
              exit 0
            fi
            echo "Upload attempt $i failed"
            i=$((i + 1))
            sleep $((i * 8))
          done
          echo "Upload failed after retries"
          exit 1

      # Same host often cannot fork after SCP (CloudLinux nproc). A login SSH
      # shell sources /etc/profile.d and burns the remaining process slots.
      - name: Extract, install, and restart
        working-directory: ${{ github.workspace }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NODEVENV: ${{ secrets.NODEVENV }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"

          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "DEPLOY_PATH secret is empty"
            exit 1
          fi
          if [ -z "${NODEVENV:-}" ]; then
            echo "NODEVENV secret is empty"
            exit 1
          fi

          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -euo pipefail

          if [ ! -f /tmp/zenith-deploy.tar.gz ]; then
            echo "Missing /tmp/zenith-deploy.tar.gz"
            exit 1
          fi
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH does not exist: $DEPLOY_PATH"
            exit 1
          fi
          if [ ! -f "$NODEVENV" ]; then
            echo "NODEVENV activate script not found: $NODEVENV"
            exit 1
          fi

          cd "$DEPLOY_PATH"

          echo "Stopping Node/Passenger before replacing .next"
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector stop --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
          fi
          pkill -9 -f "lsnode:${DEPLOY_PATH}" 2>/dev/null || true
          pkill -9 -f "Passenger NodeApp: ${DEPLOY_PATH}" 2>/dev/null || true
          pkill -9 -f "${DEPLOY_PATH}/server.js" 2>/dev/null || true
          sleep 8
          pkill -9 -f "lsnode:${DEPLOY_PATH}" 2>/dev/null || true
          pkill -9 -f "Passenger NodeApp: ${DEPLOY_PATH}" 2>/dev/null || true
          pkill -9 -f "${DEPLOY_PATH}/server.js" 2>/dev/null || true
          echo "Leftover processes:"
          ps auxww | grep -E "lsnode:|Passenger NodeApp|${DEPLOY_PATH}/server.js" | grep -v grep || true
          sleep 2

          mkdir -p data
          if [ -f data/db.json ]; then
            cp -a data/db.json data/db.json.bak
            echo "Backed up data/db.json"
          fi

          rm -f /tmp/zenith-lock.prev
          if [ -f package-lock.json ]; then
            cp -a package-lock.json /tmp/zenith-lock.prev
          fi

          echo "Replacing compiled app"
          rm -rf .next
          tar -xzf /tmp/zenith-deploy.tar.gz

          if [ -f data/db.json.bak ] && [ ! -f data/db.json ]; then
            cp -a data/db.json.bak data/db.json
            echo "Restored data/db.json from backup"
          fi

          LOCK_CHANGED=1
          if [ -d node_modules ] && [ -f /tmp/zenith-lock.prev ] && [ -f package-lock.json ] \
            && cmp -s /tmp/zenith-lock.prev package-lock.json; then
            LOCK_CHANGED=0
          fi
          rm -f /tmp/zenith-lock.prev

          # CloudLinux activate references unset vars; nounset must be off while sourcing.
          set +u
          # shellcheck source=/dev/null
          source "$NODEVENV"
          set -u

          # Shared hosting often SIGABRTs npm install. Skip when lockfile is unchanged.
          if [ "$LOCK_CHANGED" -eq 1 ]; then
            echo "Running npm install --omit=dev (lockfile changed or node_modules missing)"
            npm install --omit=dev --no-audit --no-fund --maxsockets 1
          else
            echo "Skipping npm install (package-lock.json unchanged)"
          fi

          mkdir -p tmp
          date -u +%Y-%m-%dT%H:%M:%SZ > tmp/restart.txt
          touch server.js
          touch tmp/restart.txt

          echo "Starting Node/Passenger with the new build"
          if command -v cloudlinux-selector >/dev/null 2>&1; then
            cloudlinux-selector start --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
            sleep 5
            cloudlinux-selector start --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
          fi

          rm -f /tmp/zenith-deploy.tar.gz
          echo "BUILD_ID=$(cat .next/BUILD_ID 2>/dev/null || echo missing)"
          echo "MARKER=$(tr '\n' ' ' < public/deploy-marker.txt 2>/dev/null || echo missing)"
          echo "Deploy complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE

          echo "Waiting for CloudLinux process slots after SCP..."
          sleep 20

          i=1
          while [ "$i" -le 6 ]; do
            echo "Remote deploy attempt $i"
            if ssh -p "$PORT" -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              "${SSH_USERNAME}@${SSH_HOST}" \
              "export DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH"); export NODEVENV=$(printf '%q' "$NODEVENV"); bash --noprofile --norc -s" \
              < /tmp/remote-deploy.sh; then
              echo "Remote deploy succeeded on attempt $i"
              exit 0
            fi
            echo "Remote deploy attempt $i failed"
            i=$((i + 1))
            sleep $((i * 12))
          done
          echo "Remote deploy failed after retries"
          exit 1

      - name: Confirm the live site loaded this build
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          expected_id=$(awk -F= '/^BUILD_ID=/{print $2; exit}' zenithlr/public/deploy-marker.txt | tr -d '\r')
          echo "Expected BUILD_ID=${expected_id}"
          echo "Waiting for Passenger/lsnode to finish booting..."
          sleep 25
          i=1
          while [ "$i" -le 18 ]; do
            echo "Live check attempt $i"
            # GET, not HEAD: proxies often answer HEAD without hitting Node, so
            # X-Zenith-Build is missing while the app is still starting.
            url="https://zenithlr.com/en?cb=${expected_id}-${i}"
            headers=$(curl -fsS -D - -o /dev/null -H "Cache-Control: no-cache" -H "Pragma: no-cache" "$url" || true)
            live_id=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-zenith-build"{print $2; exit}')
            echo "X-Zenith-Build=${live_id:-missing}"
            if [ -n "$expected_id" ] && [ "$live_id" = "$expected_id" ]; then
              echo "Live HTML is serving this build"
              exit 0
            fi
            i=$((i + 1))
            sleep 10
          done
          echo "Live HTML is still serving an old Node worker"
          echo "$headers"
          exit 1
