name: Deploy to TMDHosting

on:
  push:
    branches: [main]
    paths:
      - "zenithlr/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zenithlr

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: zenithlr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack production artifact
        run: npm run deploy:pack

      # appleboy/scp-action (golang SSH) often dies on this host with
      # "unexpected packet in response to channel open". OpenSSH + retries
      # matches how cPanel SSH actually behaves.
      - name: Upload package to server
        working-directory: ${{ github.workspace }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"

          i=1
          while [ "$i" -le 6 ]; do
            echo "Upload attempt $i"
            if scp -P "$PORT" -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              zenithlr/zenith-deploy.tar.gz \
              "${SSH_USERNAME}@${SSH_HOST}:/tmp/zenith-deploy.tar.gz"; then
              echo "Upload succeeded on attempt $i"
              exit 0
            fi
            echo "Upload attempt $i failed"
            i=$((i + 1))
            sleep $((i * 8))
          done
          echo "Upload failed after retries"
          exit 1

      - name: Extract, install, and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NODEVENV: ${{ secrets.NODEVENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,NODEVENV
          script: |
            set -euo pipefail

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH secret is empty"
              exit 1
            fi
            if [ -z "${NODEVENV:-}" ]; then
              echo "NODEVENV secret is empty"
              exit 1
            fi
            if [ ! -f /tmp/zenith-deploy.tar.gz ]; then
              echo "Missing /tmp/zenith-deploy.tar.gz"
              exit 1
            fi
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH does not exist: $DEPLOY_PATH"
              exit 1
            fi
            if [ ! -f "$NODEVENV" ]; then
              echo "NODEVENV activate script not found: $NODEVENV"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            mkdir -p data
            if [ -f data/db.json ]; then
              cp -a data/db.json data/db.json.bak
              echo "Backed up data/db.json"
            fi

            OLD_LOCK=""
            if [ -f package-lock.json ]; then
              OLD_LOCK="$(sha256sum package-lock.json | awk '{print $1}')"
            fi

            # Do NOT rm -rf .next before extract. On this host Passenger often keeps the
            # old worker alive; wiping hashed chunks makes listing/admin JS return 500.
            tar -xzf /tmp/zenith-deploy.tar.gz
            rm -f /tmp/zenith-deploy.tar.gz

            if [ -f data/db.json.bak ] && [ ! -f data/db.json ]; then
              cp -a data/db.json.bak data/db.json
              echo "Restored data/db.json from backup"
            fi

            NEW_LOCK=""
            if [ -f package-lock.json ]; then
              NEW_LOCK="$(sha256sum package-lock.json | awk '{print $1}')"
            fi

            # CloudLinux activate references unset vars; nounset must be off while sourcing.
            set +u
            # shellcheck source=/dev/null
            source "$NODEVENV"
            set -u

            # Shared hosting often SIGABRTs npm install. Skip when lockfile is unchanged.
            if [ ! -d node_modules ] || [ "$OLD_LOCK" != "$NEW_LOCK" ]; then
              echo "Running npm install --omit=dev (lockfile changed or node_modules missing)"
              npm install --omit=dev --no-audit --no-fund --maxsockets 1
            else
              echo "Skipping npm install (package-lock.json unchanged)"
            fi

            mkdir -p tmp
            date -u +%Y-%m-%dT%H:%M:%SZ > tmp/restart.txt
            touch server.js
            # Passenger restart hint used by some cPanel setups
            touch tmp/restart.txt

            # Longer stop/start: short restarts often leave the old worker alive on TMDHosting
            if command -v cloudlinux-selector >/dev/null 2>&1; then
              cloudlinux-selector stop --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
              sleep 5
              cloudlinux-selector start --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
              sleep 2
              cloudlinux-selector restart --json --interpreter nodejs --app-root "$DEPLOY_PATH" || true
            fi

            echo "BUILD_ID=$(cat .next/BUILD_ID 2>/dev/null || echo missing)"
            echo "Deploy complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
